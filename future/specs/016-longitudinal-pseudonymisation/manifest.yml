notes:
  - PostgreSQL through RPostgres is the only persistent backend in scope.
  - Exactly one selected table may enrol entities, but repeated entity rows remain valid.
  - Portable specifications contain crosswalk metadata only; identifier values remain in a restricted PostgreSQL relation.
  - Default results, conditions, manifests and persisted audits are value-free; explicit sensitive issues are memory-only, marked and redacted by ordinary print/structure methods, while deliberate extraction remains the caller's responsibility.
  - Pseudonymised data remain restricted personal data and are not anonymous or automatically disclosure-controlled.
  - Use only neutral synthetic examples, runtime-generated opaque identifiers and validated disposable-schema cleanup targets.
  - Independent bounded reviews cover PostgreSQL integrity/concurrency, identifier leakage and documentation usability.
  - Do not create schemas, grant roles, manage backups/logging, create a release or create a tag.
