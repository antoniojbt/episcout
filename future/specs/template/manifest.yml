id: "<id>"
slug: "<slug>"
status: draft
owner: TBD
base_branch: master
working_branch: TBD
created: YYYY-MM-DD
updated: YYYY-MM-DD

related_files:
  - R/<file>.R
  - tests/testthat/test-<feature>.R

documents:
  brief: brief.md
  sdd: sdd.md
  tdd: tdd.md
  acceptance: acceptance.md
  review: review.md

review_required: true

check_commands:
  - scripts/rscript_env_caller.R -e "options(repos = c(CRAN = 'https://cloud.r-project.org')); devtools::test(reporter = 'summary')"
  - scripts/rscript_env_caller.R -e "options(repos = c(CRAN = 'https://cloud.r-project.org')); devtools::check(manual = FALSE)"

notes:
  - Keep executable tests under tests/testthat/.
  - Keep this spec directory for planning and review only.
