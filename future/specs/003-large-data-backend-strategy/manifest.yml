  check_local: "1626 passed, six skipped, one one-core warning; inherited DST failure plus sandbox PSOCK socket error; one check error and two environment/worktree notes"
  check_cran: "1626 passed, six skipped, one one-core warning; same two failures; one check error and four inherited/external/environment notes"

notes:
  - Design is active; implementation must begin with recorded baseline evidence and failing contract tests.
  - PostgreSQL 17+ through RPostgres is the only server backend in scope; ordinary data-frame contracts remain authoritative.
  - Run one caller-owned connection sequentially inside an episcout-owned repeatable-read, read-only transaction; no database writes or multi-connection execution.
  - Full row collection, raw text/identifier output, SQL/parameter logging, approximation, sampling and implicit timestamp-without-time-zone interpretation are prohibited.
  - Canonical categorical frequencies are complete and can be sensitive; aggregate artifacts require disclosure review and are not de-identified.
  - Representative performance evidence remains external and redacted; the default end-to-end median threshold is 300 seconds across three measured runs.
  - No release, tag, project-specific material, credential operation or server administration is authorised.
