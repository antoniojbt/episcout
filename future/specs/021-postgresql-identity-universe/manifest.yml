related_files:
  - R/epi_sec_identity_universe.R
  - tests/testthat/test-sec-identity-universe.R
  - tests/testthat/test-sec-identity-universe-postgres.R
  - vignettes/longitudinal-pseudonymisation.Rmd
  - .github/workflows/r-cmd-check.yml
  - environment.yml
  - PROJECT_MAP.md
  - NEWS.md
