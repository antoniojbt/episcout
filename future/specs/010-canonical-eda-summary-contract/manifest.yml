notes:
  - Replace the unreleased EDA v1/v2 interface with one canonical typed contract.
  - Do not retain a legacy adapter; external compatibility is not required.
  - Establish analytical expectations independently before changing production code.
  - Keep implementation and release operations separate; this specification creates no tag or release.
