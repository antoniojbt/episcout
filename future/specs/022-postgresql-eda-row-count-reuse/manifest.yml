notes:
  - The change removes exactly one redundant relation count per categorical or binary variable.
  - The transaction-local checked n_total remains the only denominator.
  - Public APIs, aggregates, timing schema, privacy and publication remain unchanged.
  - Red/green unit and live tests proved the fixed two-variable fixture falls from three row-count queries to one.
  - Focused tests, PostgreSQL 18.4 EDA parity and benchmark, lint and the complete local package check pass.
  - The unrelated longitudinal pseudonymisation suite retains two registry-metadata errors on PostgreSQL 18.4; required upstream CI uses PostgreSQL 17.
