related_files:
  - R/eda_prepare.R
  - R/eda_schema.R
  - R/eda_spec.R
  - R/summary_cores.R
  - tests/testthat/test-eda-prepare.R
  - tests/testthat/test-eda_schema-fixtures.R
  - tests/testthat/test-eda_spec-fixtures.R
  - tests/testthat/test-eda-summaries.R
