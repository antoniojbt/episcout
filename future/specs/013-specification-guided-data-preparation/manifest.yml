  review: review.md

review_required: true

check_commands:
  - scripts/rscript_env_caller.R -e "options(repos = c(CRAN = 'https://cloud.r-project.org')); devtools::test(filter = 'eda-prepare|eda_schema|eda_spec|eda-summaries|run_eda', reporter = 'summary')"
  - scripts/rscript_env_caller.R -e "options(repos = c(CRAN = 'https://cloud.r-project.org')); lintr::lint_package()"
  - scripts/check-local.sh
  - scripts/check-cran.sh
  - git diff --check

notes:
  - Keep audit mode non-mutating with original data and no schema_after.
  - Resolve the full plan before any apply-mode mutation and return no partial transformation.
  - Treat missing requiredness as optional/unasserted and block character numeric parsing.
  - Require explicit reviewed timezone metadata for local ISO datetimes and normalise offset/Z input to UTC.
  - Append unexpected levels deterministically while warning that prepared data diverge from the unchanged specification.
  - Keep audits and errors free of observed values and reserve .dataset.-prefixed names for dataset audit rows.
  - Add no file output, dependency, tag or release.
