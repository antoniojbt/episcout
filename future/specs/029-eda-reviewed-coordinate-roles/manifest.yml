activation_gates:
  - accepted: Phase-B PR 238 and closeout PR 239 are merged to canonical master with all required checks green.
  - accepted: Coordinate meaning remains optional reviewed metadata orthogonal to the existing seven EDA types.
  - accepted: Scaffolds leave every coordinate field blank and validation requires exact x/y pair membership plus one shared resolvable CRS.
  - accepted: Pair QA returns aggregates and reviewed metadata only; feature values, geometry, bounds and maps remain absent from ordinary EDA results and bundles.
  - accepted: PostgreSQL computes one bounded aggregate row per pair in the existing read-only snapshot without PostGIS or coordinate collection.

baseline:
  workflow_state: "Canonical master, closed issue 233 and completed specs 026-028 match GitHub; issue 237 is open and its activation gate is satisfied."
  compatibility: "Existing EDA specifications may omit all three coordinate fields and retain their existing seven-type analysis semantics."
  privacy: "Existing EDA workflows do not interpret coordinate roles or publish coordinate-pair QA."
  stack_authority: "The owner authorised implementation to continue on a branch stacked on the green planning PR without waiting for its merge."

notes:
  - Planning PR records the contract only; package behaviour changes begin on the stacked implementation branch after planning CI is green.
  - Draft planning PR 240 is the review gate for the contract; it references issue 237 without closing it.
  - The implementation is the terminal bounded Phase-C slice of the current geospatial programme; later inferential spatial work requires a separate concrete scientific question and tracker.
  - PostgreSQL 17 is the supported CI service; local PostgreSQL 18.4 evidence will be recorded separately.
