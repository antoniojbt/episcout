activation_gates:
  - accepted: Keep sf optional in Suggests and return one actionable dependency error from every geo entry point when it is unavailable.
  - accepted: Accept EPSG integers and character authority/WKT inputs that resolve through sf::st_crs(); reject missing or unresolvable CRS values.
  - accepted: Coordinate conversion is all-or-nothing and returns data, audit and metadata without geometry when any row is blocked.
  - accepted: Support XY point, multipoint, line, multiline, polygon and multipolygon geometry; reject geometry collections and non-XY dimensions in phase A.
  - accepted: Write only named GeoPackage layers through a staged complete-file copy, preserving unrelated layers and the prior destination on failure.
  - accepted: Use repository-created neutral geometries and an independently published EPSG transformation control; do not add a downloaded runtime fixture.

notes:
  - Completed design-only spec 026 is the source contract for this bounded phase-A implementation.
  - Phase-B PostGIS collection and phase-C aggregate EDA-coordinate integration remain out of scope.
  - PR 234 merged to canonical master as b37b391c1ff57aa9d84c4b0beb31be4d90558b03; tracking issue 226 closed automatically.
  - Phase-B successor issue 233 exists but remains unstarted until this closeout becomes canonical.
  - Inferential analysis, raster support, web mapping, automatic coordinate discovery and spatial database writes remain out of scope.
