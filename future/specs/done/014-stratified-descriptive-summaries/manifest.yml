notes:
  - Reuse canonical typed summary calculations; do not copy statistical formulas.
  - V1 strata is exactly one character column name.
  - Overall describes the included analysis population so counts always reconcile.
  - Calculation remains long-form and numeric; Table 1 is a pure long-form presentation.
  - No p-values, disclosure control, file output, new dependency, tag or release.
