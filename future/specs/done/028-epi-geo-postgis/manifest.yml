activation_gates:
  - accepted: Use only a caller-owned open RPostgres connection and exact separate schema, relation and optional geometry-column identifiers.
  - accepted: Describe catalogue and geometry QA only inside one owned read-only repeatable-read snapshot; never return feature geometry or ordinary attributes from description.
  - accepted: Make collection the only feature-materialisation path, require an explicit non-geometry allow-list and positive max_features, and fail rather than truncate.
  - accepted: Accept only typed bbox objects created by the package in the source CRS; translate extents with bound values and quoted identifiers.
  - accepted: Reject absent PostGIS, ambiguous spatial columns, unknown or mixed SRIDs, unsupported dimensions/types and catalogue drift with value-free conditions.
  - accepted: Support ordinary tables, views and materialized views; reject foreign, temporary and unsupported relation kinds for this spatial contract.

baseline:
  workflow_state: "Canonical master and completed implementation records matched GitHub before activation."
  environment: "R 4.5.3, sf 1.1.2, RPostgres 1.4.10, DBI 1.3.0 and PostgreSQL 18.4 client/server binaries are present in the episcout environment."
  postgis: "No local PostGIS extension or usable pre-existing service was present at activation; mandatory live evidence will use a disposable environment and the PostGIS-enabled CI service."
  exception: "The owner explicitly authorised stacked activation once closeout PR 236 was green, without waiting for its merge; the implementation PR remains dependent on PR 236."

