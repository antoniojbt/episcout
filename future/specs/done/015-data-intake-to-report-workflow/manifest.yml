review_required: true
check_commands:
  - scripts/rscript_env_caller.R -e "options(repos = c(CRAN = 'https://cloud.r-project.org')); devtools::test(filter = 'eda-intake|eda-spec|eda-prepare|eda-summaries|eda-stratified|eda-table1', reporter = 'summary')"
  - scripts/rscript_env_caller.R -e "devtools::load_all(quiet = TRUE); findings <- lintr::lint_package(); print(findings); if (length(findings) > 0L) quit(status = 1L)"
  - scripts/check-local.sh
  - scripts/check-cran.sh
  - git diff --check
notes:
  - Compose existing public component contracts; do not add inference, coercion or statistical formulae.
  - V1 accepts an in-memory data frame and at most one categorical or binary stratifier.
  - Expected review gates return a stable run object; malformed top-level arguments and internal invariant failures remain errors.
  - Write no row-level data, raw text examples, observed identifier values, bridge tables, secrets or automatically inferred sensitive absolute source paths.
  - A non-empty overwrite target must match its prior manifest-created files and checksums exactly; refuse unowned, missing, modified or special entries before staging.
  - Build a complete sibling staging bundle, then publish by target-to-backup and staging-to-target directory renames with restoration where possible.
  - Base-R escaped HTML reads saved CSV artifacts and makes incomplete and disclosure states visible without a template/report dependency.
  - No network access, Codecov credential, new workflow framework, tag or release is in scope.
